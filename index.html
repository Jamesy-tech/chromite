<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chromecast Debugger</title>
</head>
<body>

<h1>Chromecast Debugger</h1>

<google-cast-launcher></google-cast-launcher>
<button id="manual-cast-btn">Trigger Cast Prompt</button>

<script>
window.__onGCastApiAvailable = function(isAvailable) {
    console.log("Cast API available:", isAvailable);

    if (!isAvailable) return;

    const context = cast.framework.CastContext.getInstance();

    context.setOptions({
        receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
    });

    document.getElementById("manual-cast-btn").onclick = function() {
        console.log("Requesting Cast session...");

        context.requestSession()
            .then(function(session) {
                console.log("Cast session started:", session);
            })
            .catch(function(error) {
                console.error("Cast request failed:", error);
            });
    };
};
</script>

<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

</body>
</html>
