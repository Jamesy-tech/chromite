<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromecast Sender Debugger</title>
</head>
<body>

    <h1>Chromecast Controller</h1>
    
    <div>
        <google-cast-launcher id="castbutton"></google-cast-launcher>
        <button id="manualCast">Trigger Programmatic Prompt</button>
    </div>

    <h2>Console Logs</h2>
    <div id="debugLog" style="width:100%; height:300px; background:#111; color:#0f0; font-family:monospace; padding:10px; overflow-y:auto; border:1px solid #333; box-sizing:border-box;"></div>

    <script>
        const logBox = document.getElementById('debugLog');
        
        function log(msg, type = 'INFO') {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${time}] [${type}] ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
            console.log(`[${type}] ${msg}`);
        }

        window.onerror = function(message, source, lineno, colno, error) {
            log(`${message} at ${source}:${lineno}`, 'ERROR');
            return false;
        };

        window['__onGCastApiAvailable'] = function(isAvailable) {
            log(`__onGCastApiAvailable triggered. Availability: ${isAvailable}`);
            if (isAvailable) {
                initializeCastApi();
            } else {
                log('Google Cast API fallback triggered: Not Available', 'WARN');
            }
        };

        function initializeCastApi() {
            log('Initializing Cast Context...');
            try {
                const context = cast.framework.CastContext.getInstance();
                context.setOptions({
                    receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                    autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
                });
                
                log('Cast Context successfully initialized.');
                setupCastEventListeners(context);
            } catch (err) {
                log(`Initialization failed: ${err.message}`, 'ERROR');
            }
        }

        function setupCastEventListeners(context) {
            context.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED, function(event) {
                log(`Cast State Changed: ${event.castState}`);
            });

            context.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, function(event) {
                log(`Session State Changed: ${event.sessionState}`);
            });
        }

        document.getElementById('manualCast').addEventListener('click', async function() {
            log('Manual prompt button clicked. Checking states...');
            try {
                const context = cast.framework.CastContext.getInstance();
                log(`Current state status: ${context.getCastState()}`);
                
                log('Requesting casting session trigger...');
                const session = await context.requestSession();
                log('Session established successfully!');
            } catch (err) {
                log(`Session request rejection or error: ${err}`, 'WARN');
            }
        });
    </script>

    <script src="https://gstatic.com"></script>

</body>
</html>
